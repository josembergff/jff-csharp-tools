name: CI/CD - JFF CSharp Tools

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-build:
    name: Teste e build (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore jff-csharp-tools.sln

      - name: Testes
        run: dotnet test jff-csharp-tools.sln -c Release --verbosity normal

      - name: Build
        run: dotnet build jff-csharp-tools.sln -c Release --no-restore
